# Generated by C2P (kyverno-cel) — rule container-runs-unprivileged / check kyverno-cel-container-runs-unprivileged
# TEST: ValidatingPolicy CEL expressions assert privileged=false allowPrivilegeEscalation=false runAsNonRoot=true capabilities.drop contains ALL and no host namespaces or hostPath volumes
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kyverno-cel-container-runs-unprivileged
  labels:
    compliance.oscal/rule-id: container-runs-unprivileged
    compliance.oscal/check-id: kyverno-cel-container-runs-unprivileged
    compliance.oscal/control-ids: ac-6_sc-39
spec:
  validationActions: [Deny, Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: storefront
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    - name: pod
      expression: "object.spec.template.spec"
    - name: containers
      expression: >-
        variables.pod.containers +
        (has(variables.pod.initContainers) ? variables.pod.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
      message: "NIST SP 800-53 ac-6 sc-39: no container may run privileged (check kyverno-cel-container-runs-unprivileged)"
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "NIST SP 800-53 ac-6: allowPrivilegeEscalation must be set to false on every container (check kyverno-cel-container-runs-unprivileged)"
    - expression: >-
        (has(variables.pod.securityContext) && has(variables.pod.securityContext.runAsNonRoot) &&
         variables.pod.securityContext.runAsNonRoot == true) ||
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: "NIST SP 800-53 ac-6: runAsNonRoot must be true on the pod or on every container (check kyverno-cel-container-runs-unprivileged)"
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL'))
      message: "NIST SP 800-53 ac-6: every container must drop ALL capabilities (check kyverno-cel-container-runs-unprivileged)"
    - expression: >-
        (!has(variables.pod.hostPID) || variables.pod.hostPID == false) &&
        (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) &&
        (!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false)
      message: "NIST SP 800-53 sc-39: host PID, IPC and network namespaces must not be shared (check kyverno-cel-container-runs-unprivileged)"
    - expression: >-
        !has(variables.pod.volumes) || variables.pod.volumes.all(v, !has(v.hostPath))
      message: "NIST SP 800-53 sc-39: hostPath volumes are not permitted (check kyverno-cel-container-runs-unprivileged)"
