# Generated by C2P (kyverno-cel) — rule image-pinned-by-digest / check kyverno-cel-image-pinned-by-digest
# TEST: ValidatingPolicy requires every container image reference to match the digest form repository@sha256:digest
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kyverno-cel-image-pinned-by-digest
  labels:
    compliance.oscal/rule-id: image-pinned-by-digest
    compliance.oscal/check-id: kyverno-cel-image-pinned-by-digest
    compliance.oscal/control-ids: cm-2_si-7
spec:
  validationActions: [Deny, Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: storefront
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    - name: containers
      expression: >-
        object.spec.template.spec.containers +
        (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
    - name: unpinned
      expression: "variables.containers.filter(c, !c.image.contains('@sha256:'))"
  validations:
    - expression: "size(variables.unpinned) == 0"
      messageExpression: >-
        'NIST SP 800-53 cm-2 si-7: container images must be pinned by digest, not by a mutable tag. Offending: ' +
        variables.unpinned.map(c, c.image).join(', ') + ' (check kyverno-cel-image-pinned-by-digest)'
