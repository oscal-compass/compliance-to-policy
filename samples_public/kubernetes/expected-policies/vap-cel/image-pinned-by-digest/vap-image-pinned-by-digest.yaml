# Generated by C2P (vap-cel) — rule image-pinned-by-digest / check vap-image-pinned-by-digest
# TEST: ValidatingAdmissionPolicy requires every container image reference to contain @sha256: at admission time. No background scan so pre-existing violations stay invisible to this check
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vap-image-pinned-by-digest
  labels:
    compliance.oscal/rule-id: image-pinned-by-digest
    compliance.oscal/check-id: vap-image-pinned-by-digest
    compliance.oscal/control-ids: cm-2_si-7
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    - name: containers
      expression: >-
        object.spec.template.spec.containers +
        (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
    - name: unpinned
      expression: "variables.containers.filter(c, !c.image.contains('@sha256:'))"
  validations:
    - expression: "size(variables.unpinned) == 0"
      messageExpression: >-
        'NIST SP 800-53 cm-2 si-7: container images must be pinned by digest, not by a mutable tag. Offending: ' +
        variables.unpinned.map(c, c.image).join(', ') + ' (check vap-image-pinned-by-digest)'
      reason: Invalid
  auditAnnotations:
    - key: compliance-check
      valueExpression: "'vap-image-pinned-by-digest'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vap-image-pinned-by-digest
  labels:
    compliance.oscal/rule-id: image-pinned-by-digest
    compliance.oscal/check-id: vap-image-pinned-by-digest
spec:
  policyName: vap-image-pinned-by-digest
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: storefront
