# Generated by C2P (kyverno-dsl) — rule container-runs-unprivileged / check kyverno-dsl-container-runs-unprivileged
# TEST: ClusterPolicy denies privileged containers allowPrivilegeEscalation host namespaces hostPath volumes and any container that does not drop ALL capabilities
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kyverno-dsl-container-runs-unprivileged
  labels:
    compliance.oscal/rule-id: container-runs-unprivileged
    compliance.oscal/check-id: kyverno-dsl-container-runs-unprivileged
    compliance.oscal/control-ids: ac-6_sc-39
  annotations:
    policies.kyverno.io/title: Storefront containers run unprivileged
    policies.kyverno.io/description: >-
      NIST SP 800-53 ac-6 sc-39. A root container holding broad Linux capabilities, or one
      sharing a host namespace, collapses its execution domain into the host's.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privilege-and-no-host-namespaces
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              namespaces: [storefront]
      validate:
        message: "NIST SP 800-53 ac-6 sc-39: containers must not be privileged, must not escalate privileges, must run as non-root and must drop ALL capabilities (check kyverno-dsl-container-runs-unprivileged)"
        pattern:
          spec:
            template:
              spec:
                =(hostPID): "false"
                =(hostIPC): "false"
                =(hostNetwork): "false"
                containers:
                  - securityContext:
                      =(privileged): "false"
                      allowPrivilegeEscalation: "false"
                      runAsNonRoot: "true"
                      capabilities:
                        drop: ["ALL"]
    - name: no-hostpath-volumes
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              namespaces: [storefront]
      validate:
        message: "NIST SP 800-53 sc-39: hostPath volumes are not permitted (check kyverno-dsl-container-runs-unprivileged)"
        pattern:
          spec:
            template:
              spec:
                =(volumes):
                  - X(hostPath): "null"
