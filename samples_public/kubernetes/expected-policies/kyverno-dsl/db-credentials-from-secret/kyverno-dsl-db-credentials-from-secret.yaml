# Generated by C2P (kyverno-dsl) — rule db-credentials-from-secret / check kyverno-dsl-db-credentials-from-secret
# TEST: ClusterPolicy denies any env entry whose name is in credential_env_keys and that carries a literal value instead of valueFrom.secretKeyRef
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kyverno-dsl-db-credentials-from-secret
  labels:
    compliance.oscal/rule-id: db-credentials-from-secret
    compliance.oscal/check-id: kyverno-dsl-db-credentials-from-secret
    compliance.oscal/control-ids: ia-5
  annotations:
    policies.kyverno.io/title: Database credentials come from a Secret
    policies.kyverno.io/description: >-
      NIST SP 800-53 ia-5. A literal credential in a workload manifest is disclosed in
      kubectl output, in etcd, in Git and in every audit record that carries the object.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: credential-env-must-use-secretkeyref
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              namespaces: [storefront]
      validate:
        # The message cannot name {{ element.name }}: Kyverno rejects the policy with
        # "variable 'element.name' present outside of foreach", because element only exists
        # inside the foreach below. Keep the message static and let the parameter name the keys.
        message: >-
          NIST SP 800-53 ia-5: a credential environment variable carries a literal value and must
          use valueFrom.secretKeyRef instead. Keys that must come from a Secret:
          POSTGRES_PASSWORD POSTGRES_USER APP_DB_PASSWORD APP_DB_DSN (check kyverno-dsl-db-credentials-from-secret)
        foreach:
          - list: "request.object.spec.template.spec.containers[].env[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: AnyIn
                    value: ["POSTGRES_PASSWORD","POSTGRES_USER","APP_DB_PASSWORD","APP_DB_DSN"]
                  - key: "{{ element.keys(@) }}"
                    operator: AnyIn
                    value: ["value"]
