# Generated by C2P (kyverno-cel) — rule db-credentials-from-secret / check kyverno-cel-db-credentials-from-secret
# TEST: ValidatingPolicy requires every env entry named in credential_env_keys to use valueFrom.secretKeyRef
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kyverno-cel-db-credentials-from-secret
  labels:
    compliance.oscal/rule-id: db-credentials-from-secret
    compliance.oscal/check-id: kyverno-cel-db-credentials-from-secret
    compliance.oscal/control-ids: ia-5
spec:
  validationActions: [Deny, Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: storefront
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    - name: credentialKeys
      expression: '["POSTGRES_PASSWORD","POSTGRES_USER","APP_DB_PASSWORD","APP_DB_DSN"]'
    - name: containers
      expression: >-
        object.spec.template.spec.containers +
        (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
    # Same expression as the vap-cel output. Kyverno's CEL does provide flatten(), but
    # ValidatingAdmissionPolicy's does not, so neither engine uses it.
    - name: offenders
      expression: >-
        variables.containers.filter(c,
          has(c.env) && c.env.exists(e, e.name in variables.credentialKeys && has(e.value)))
  validations:
    - expression: "size(variables.offenders) == 0"
      messageExpression: >-
        'NIST SP 800-53 ia-5: credential environment variables must come from a Secret via valueFrom.secretKeyRef, not a literal value. Offending containers: ' +
        variables.offenders.map(c, c.name).join(', ') + ' (check kyverno-cel-db-credentials-from-secret)'
